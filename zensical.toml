[project]
site_name = "Semantic Layers"
site_description = "Business definitions your agents run, not paraphrase: verified, executable synalog predicates"
site_author = "Synalinks"
site_url = "https://synalinks.github.io/semantic-layers/"
repo_url = "https://github.com/synalinks/semantic-layers"
repo_name = "synalinks/semantic-layers"
edit_uri = "edit/main/docs/"
copyright = """
Copyright &copy; 2026 Synalinks
"""

nav = [
  { "Home" = "index.md" },
  { "Why semantic layers" = "why.md" },
  { "Getting started" = "getting-started.md" },
  { "Specification" = "specification.md" },
  { "Sharing" = "sharing.md" },
  { "Agents" = "agents.md" },
  { "CLI" = "cli.md" },
  { "Examples" = "examples.md" },
  { "Development" = "development.md" },
]

[project.theme]
language = "en"
features = [
    "content.action.edit",
    "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/synalinks/semantic-layers"

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.snippets]
base_path = ["."]
check_paths = true
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
