name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      # pyproject.toml takes synalog from a checkout beside this one
      # (../synalog) until the features it needs are released: synalog 2.0,
      # on its branch until SynaLinks/synalog#13 is merged (then back to main).
      - uses: actions/checkout@v6
        with:
          path: semantic-layers
      - uses: actions/checkout@v6
        with:
          repository: synalinks/synalog
          ref: feat/v2-assertions
          path: synalog
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Lint
        working-directory: semantic-layers
        run: ./shell/lint.sh
      - name: Test
        working-directory: semantic-layers
        run: ./shell/test.sh
