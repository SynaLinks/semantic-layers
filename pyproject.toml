[project]
name = "semantic-layers"
version = "0.1.0"
description = "Install and connect semantic layers: business definitions as verified, executable synalog predicates."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Synalinks" }]
keywords = ["semantic layer", "agents", "synalog", "datalog", "sql", "agent skills"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "synalog>=2.1.0",
    "pyyaml>=6",
    "tomli>=1.1; python_version < '3.11'",
]

[project.scripts]
semantic-layers = "semantic_layers.cli:main"

[project.urls]
Homepage = "https://synalinks.github.io/semantic-layers/"
Repository = "https://github.com/synalinks/semantic-layers"
Documentation = "https://synalinks.github.io/semantic-layers/"

[project.optional-dependencies]
psql = ["psycopg[binary]>=3"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_layers"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Sample .l files are written inline, one line per synalog line.
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
