<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="-6 -26 212 234" role="img" aria-label="Semantic Layers">
  <defs>
    <radialGradient id="bulb" cx="0.36" cy="0.25" r="0.9">
      <stop offset="0%" stop-color="#F7E6FD"/>
      <stop offset="45%" stop-color="#D7A8EE"/>
      <stop offset="100%" stop-color="#A363CC"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="0.3" y2="0">
      <stop offset="0%" stop-color="#4FA65A"/>
      <stop offset="100%" stop-color="#9BE07F"/>
    </linearGradient>
  </defs>

  <!-- roots -->
  <g fill="#EBD8B8" stroke="#EEDCFA" stroke-width="1.6" stroke-linejoin="round">
    <path d="M93.8 187.1 Q 88.9 191.1 85.4 196.4 Q 92.4 195.0 97.3 190.9 Z"/>
    <path d="M95.3 188.0 Q 92.3 195.2 91.5 202.0 Q 97.1 197.1 100.2 190.0 Z"/>
    <path d="M97.4 189.0 Q 97.4 197.2 100.0 204.0 Q 102.6 197.2 102.6 189.0 Z"/>
    <path d="M99.8 190.0 Q 102.9 197.1 108.5 202.0 Q 107.7 195.2 104.7 188.0 Z"/>
    <path d="M102.7 190.9 Q 107.6 195.0 114.6 196.4 Q 111.1 191.1 106.2 187.1 Z"/>
  </g>

  <!-- the bottom half -->
  <path d="M32 122 C 28 160, 58 192, 100 192 C 142 192, 172 160, 168 122 Z" fill="url(#bulb)" stroke="#EEDCFA" stroke-width="4" stroke-linejoin="round"/>

  <!-- its cut: the layers, ring inside ring -->
  <ellipse cx="100" cy="122" rx="68" ry="18.4" fill="#FDF7FF" stroke="#EEDCFA" stroke-width="4"/>
  <ellipse cx="100" cy="122" rx="56" ry="15.1" fill="#F3DDFA" stroke="#C595DE" stroke-width="2.4"/>
  <ellipse cx="100" cy="122" rx="44" ry="11.9" fill="#FBF2FE" stroke="#C595DE" stroke-width="2.4"/>
  <ellipse cx="100" cy="122" rx="32" ry="8.6" fill="#F3DDFA" stroke="#C595DE" stroke-width="2.4"/>
  <ellipse cx="100" cy="122" rx="20" ry="5.4" fill="#FBF2FE" stroke="#C595DE" stroke-width="2.4"/>
  <ellipse cx="100" cy="122" rx="8" ry="2.2" fill="#E9C6F6" stroke="#C595DE" stroke-width="2.4"/>

  <!-- the lid, lifted and tipped back -->
  <g transform="translate(0 -30) rotate(-9 100 122)">
    <path d="M97 62 C 88 50, 76 38, 78 20 C 92 28, 101 42, 101 60 Z" fill="url(#leaf)" stroke="#EEDCFA" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M103 62 C 106 46, 117 32, 134 26 C 133 42, 121 54, 105 62 Z" fill="url(#leaf)" stroke="#EEDCFA" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- its underside: the same layers -->
    <ellipse cx="100" cy="122" rx="68" ry="18.4" fill="#FDF7FF" stroke="#EEDCFA" stroke-width="4"/>
    <ellipse cx="100" cy="122" rx="54" ry="14.6" fill="#F3DDFA" stroke="#C595DE" stroke-width="2.4"/>
    <ellipse cx="100" cy="122" rx="40" ry="10.8" fill="#FBF2FE" stroke="#C595DE" stroke-width="2.4"/>
    <path d="M32 122 C 32 104, 50 92, 68 85 C 85 78, 94 70, 94 60 L 106 60 C 106 70, 115 78, 132 85 C 150 92, 168 104, 168 122 C 140 134, 60 134, 32 122 Z" fill="url(#bulb)" stroke="#EEDCFA" stroke-width="4" stroke-linejoin="round"/>
    <ellipse cx="66" cy="100" rx="5" ry="11" transform="rotate(50 66 100)" fill="#FFFFFF" opacity="0.7"/>
  </g>

  <!-- sparkles: look inside -->
  <g fill="#F6C543">
    <path d="M182 104 l 3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 Z"/>
    <path d="M14 96 l 2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 Z"/>
  </g>

  <!-- shine on the bottom half -->
  <ellipse cx="48" cy="150" rx="5" ry="12" transform="rotate(20 48 150)" fill="#FFFFFF" opacity="0.55"/>

  <!-- face, looking up at its layers -->
  <ellipse cx="82" cy="156" rx="7.5" ry="9.5" fill="#33193F"/>
  <ellipse cx="118" cy="156" rx="7.5" ry="9.5" fill="#33193F"/>
  <circle cx="84" cy="151" r="3.2" fill="#FFFFFF"/>
  <circle cx="120" cy="151" r="3.2" fill="#FFFFFF"/>
  <circle cx="80" cy="160" r="1.4" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="116" cy="160" r="1.4" fill="#FFFFFF" opacity="0.8"/>
  <ellipse cx="66" cy="172" rx="9" ry="5" fill="#FF8FB8" opacity="0.7"/>
  <ellipse cx="134" cy="172" rx="9" ry="5" fill="#FF8FB8" opacity="0.7"/>
  <path d="M94 170 Q 100 178 106 170 Z" fill="#7A2E52" stroke="#33193F" stroke-width="3" stroke-linejoin="round"/>
</svg>
